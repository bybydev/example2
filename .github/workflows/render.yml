name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition ID to render (Main or a chapter composition ID)"
        required: false
        default: "Main"
        type: string
      frames:
        description: "Optional frame range for quick previews (e.g. 0-300)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: remotion-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: remotion-build-${{ github.run_id }}-${{ github.run_attempt }}
      PROJECT_SLUG: ${{ github.event.repository.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Shorts specs
        run: |
          node -e '
            const t = require("./src/generated/timeline.json");
            console.log(`Shorts canvas: ${t.width}x${t.height} @ ${t.fps}fps, duration: ${t.totalSeconds}s (${t.totalFrames} frames)`);
            if (t.width !== 1080 || t.height !== 1920) {
              console.error(`error: expected 1080x1920 vertical Shorts canvas, got ${t.width}x${t.height}`);
              process.exit(1);
            }
            if (t.totalSeconds > 180) {
              console.error(`error: duration ${t.totalSeconds}s exceeds YouTube Shorts 180s maximum`);
              process.exit(1);
            }
            if (t.totalSeconds > 60) {
              console.log(`::warning::Short duration is ${t.totalSeconds}s (over 60s sweet spot, still within 180s Shorts limit)`);
            }
          '

      - name: Install Remotion browser
        run: npx remotion browser ensure

      - name: Render video
        env:
          COMPOSITION: ${{ inputs.composition || 'Main' }}
          FRAMES: ${{ inputs.frames || '' }}
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "$COMPOSITION" = "Main" ] && [ -z "$FRAMES" ]; then
            npm run build
          else
            slug="$(echo "$COMPOSITION" | tr '[:upper:]' '[:lower:]')"
            if [ -n "$FRAMES" ]; then
              npx remotion render src/index.ts "$COMPOSITION" "out/${slug}-${FRAMES}.mp4" --frames="$FRAMES"
            else
              npx remotion render src/index.ts "$COMPOSITION" "out/${slug}.mp4"
            fi
          fi

      - name: Render thumbnail
        run: |
          set -euo pipefail
          mkdir -p out
          npx remotion still src/index.ts Thumbnail out/thumbnail.png

      - name: Stage release assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          videos=(out/*.mp4)
          if (( ${#videos[@]} == 0 )); then
            echo "error: render produced no MP4 files in out/" >&2
            exit 1
          fi

          mkdir -p artifacts
          for video in "${videos[@]}"; do
            name="$(basename "$video" .mp4)"
            cp "$video" "artifacts/${PROJECT_SLUG}-${name}-${RELEASE_TAG}.mp4"
          done

          if [ -s out/thumbnail.png ]; then
            cp out/thumbnail.png "artifacts/${PROJECT_SLUG}-thumbnail-${RELEASE_TAG}.png"
          fi

          if [ -s content/subtitles.srt ]; then
            cp content/subtitles.srt "artifacts/${PROJECT_SLUG}-${RELEASE_TAG}.srt"
          fi

      - name: Verify release assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(artifacts/*.mp4 artifacts/*.png artifacts/*.srt)
          if (( ${#assets[@]} == 0 )); then
            echo "error: no release assets staged" >&2
            exit 1
          fi

          for asset in "${assets[@]}"; do
            test -s "$asset"
            bytes=$(stat -c%s "$asset")
            if (( bytes >= 2147483648 )); then
              echo "error: $asset exceeds GitHub's 2 GiB release asset limit" >&2
              exit 1
            fi
            echo "$asset: $bytes bytes"
          done

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --prerelease \
            --generate-notes
